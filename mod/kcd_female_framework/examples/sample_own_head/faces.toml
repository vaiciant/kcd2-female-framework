# A face pack with a head of its own for KCD2 Female Framework (MAKING_FACES.md, "A head of your own"). Its head is a
# stand-in: stand_in.py copies a woman's head of the game into source/, where your own head would go. Then, from the root
# of the framework's repository:
#     python -I -X utf8 mod/kcd_female_framework/examples/sample_own_head/stand_in.py
#     python -I -X utf8 mod/kcd_female_framework/tools/make_face_pack.py mod/kcd_female_framework/examples/sample_own_head
# and the tool fits the head to the player's skeleton and writes it into the mod, with its node.

[pack]
id = "sample_own_head"
name = "Sample Own Head"
description = "A sample face with a head of its own for KCD2 Female Framework"
author = "KCD2 Life"
version = "0.1.0"

[[face]]
name = "sample_own_woman"
head_mesh = "source/f_head_020/f_head_020.skin"   # your head, on the game's female skeleton: its LODs and its poses go
                                                  # next to it
material = "source/f_head_020/f_head_020.mtl"     # its material
body = "ml_ff_body_tan_03"
hair = 5
color = "blonde"
