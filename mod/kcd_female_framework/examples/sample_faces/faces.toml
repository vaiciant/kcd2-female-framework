# A face pack for KCD2 Female Framework (MAKING_FACES.md): this file is all you write. Then, from the root of the
# framework's repository:
#     python -I -X utf8 mod/kcd_female_framework/tools/make_face_pack.py path/to/your_mod
# and the tool writes the rest into your mod: the tokens, the Skald project and the Lua that registers the faces.

[pack]
id = "sample_faces"              # the id of your mod: lowercase letters, digits and _
name = "Sample Faces"            # for mod.manifest, if your mod has none yet
description = "Two sample faces for KCD2 Female Framework"
author = "KCD2 Life"
version = "0.1.0"
# block = 7                      # optional: your ids are 200 + 10 x block, from 0 to 29. Without it, the tool picks one
                                 # from the id of your mod.

# One [[face]] for each face, up to ten.
[[face]]
name = "sample_redhead"          # the name players type, as ml_ff_look sample_redhead
head = "ml_ff_head_016"          # a head of the framework: LOOKS.md lists them
body = "ml_ff_body_tan_03"       # a body of the framework: ml_ff_body_*
hair = 2                         # the hair she starts with: a style from 1 to 7
color = "ginger"                 # and its color: dark_brown, black, light_brown, blonde, ginger, dark_ginger,
                                 # dark_grey, grey or white (style 3 has only the first six)
age = "young"                    # optional: young or old

[[face]]
name = "sample_dark"
head = "ml_ff_head_001"
body = "ml_ff_body_pale_04"
hair = 4
color = "black"
